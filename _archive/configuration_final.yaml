# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

# MQTT Configuration - Single unified section
mqtt:
  sensor:
    - name: "Adaptive Hour"
      state_topic: "home/sensor/hour"
    - name: "Adaptive Motion"
      state_topic: "home/sensor/motion"
    - name: "Adaptive Light Level"
      state_topic: "home/sensor/light"
    - name: "Adaptive Predicted Brightness"
      state_topic: "home/device/light/brightness"
    - name: "Conflict Resolution"
      state_topic: "home/conflict/resolution"
    - name: "Environment Hour"
      state_topic: "home/sensor/hour"
      unit_of_measurement: "h"
      icon: "mdi:clock-outline"
    - name: "Environment Motion"
      state_topic: "home/sensor/motion"
      icon: "mdi:motion-sensor"
    - name: "Environment Light Level"
      state_topic: "home/sensor/light"
      unit_of_measurement: "lux"
      icon: "mdi:brightness-6"
    - name: "Parent Location"
      state_topic: "home/user/parent/location"
      icon: "mdi:account"
    - name: "Child Location"
      state_topic: "home/user/child/location"
      icon: "mdi:account-child"
    - name: "Guest Location"
      state_topic: "home/user/guest/location"
      icon: "mdi:account-supervisor"
    - name: "AI Predicted Brightness"
      state_topic: "home/device/light/brightness"
      unit_of_measurement: "%"
      icon: "mdi:lightbulb-on"
    - name: "Conflict Status"
      state_topic: "home/conflict/brightness"
      icon: "mdi:alert-circle"

# Input helpers (sliders in UI) - ONLY THESE, NO MQTT NUMBER
input_number:
  parent_brightness:
    name: "Parent's Preferred Brightness"
    min: 0
    max: 100
    step: 5
    unit_of_measurement: "%"
    icon: "mdi:account"
  
  child_brightness:
    name: "Child's Preferred Brightness"
    min: 0
    max: 100
    step: 5
    unit_of_measurement: "%"
    icon: "mdi:account-child"
  
  guest_brightness:
    name: "Guest's Preferred Brightness"
    min: 0
    max: 100
    step: 5
    unit_of_measurement: "%"
    icon: "mdi:account-supervisor"

# Automations to send slider changes to MQTT
automation:
  - alias: "Parent Set Brightness"
    trigger:
      - platform: state
        entity_id: input_number.parent_brightness
    action:
      - service: mqtt.publish
        data:
          topic: "home/user/parent/brightness_pref"
          payload: "{{ states('input_number.parent_brightness') }}"
  
  - alias: "Child Set Brightness"
    trigger:
      - platform: state
        entity_id: input_number.child_brightness
    action:
      - service: mqtt.publish
        data:
          topic: "home/user/child/brightness_pref"
          payload: "{{ states('input_number.child_brightness') }}"
  
  - alias: "Guest Set Brightness"
    trigger:
      - platform: state
        entity_id: input_number.guest_brightness
    action:
      - service: mqtt.publish
        data:
          topic: "home/user/guest/brightness_pref"
          payload: "{{ states('input_number.guest_brightness') }}"
