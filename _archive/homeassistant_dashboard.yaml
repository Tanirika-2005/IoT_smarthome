# Home Assistant Lovelace Dashboard for Multi-User Conflict Resolution Demo
# Copy this into your dashboard configuration (Settings > Dashboards > Edit Dashboard > Raw Configuration)

title: Multi-User AI Brightness Control
views:
  - title: Demo
    icon: mdi:lightbulb-group
    cards:
      # Main title card
      - type: markdown
        content: |
          # 🏠 Multi-User AI Brightness Control
          
          **Live Demo**: Multiple users can set brightness preferences. The AI resolves conflicts using priority rules.
          
          **Priority**: Parent (🟢 High) > Child (🟡 Medium) > Guest (🔴 Low)
      
      # Current environment
      - type: entities
        title: 📊 Current Environment
        entities:
          - entity: sensor.environment_hour
            name: "Simulated Hour"
          - entity: sensor.environment_motion
            name: "Motion Detected"
          - entity: sensor.environment_light_level
            name: "Ambient Light"
        state_color: true
      
      # User locations
      - type: entities
        title: 👥 User Locations
        entities:
          - entity: sensor.parent_location
            name: "🟢 Parent"
          - entity: sensor.child_location
            name: "🟡 Child"
          - entity: sensor.guest_location
            name: "🔴 Guest"
        state_color: true
      
      # AI prediction
      - type: gauge
        entity: sensor.ai_predicted_brightness
        name: "🤖 AI Resolved Brightness"
        min: 0
        max: 100
        severity:
          green: 50
          yellow: 30
          red: 10
        needle: true
      
      # User controls - Parent
      - type: entities
        title: 🟢 Parent Control (Priority 2 - Highest)
        entities:
          - entity: input_number.parent_brightness
            name: "Set Brightness"
      
      # User controls - Child
      - type: entities
        title: 🟡 Child Control (Priority 1 - Medium)
        entities:
          - entity: input_number.child_brightness
            name: "Set Brightness"
      
      # User controls - Guest
      - type: entities
        title: 🔴 Guest Control (Priority 0 - Lowest)
        entities:
          - entity: input_number.guest_brightness
            name: "Set Brightness"
      
      # Conflict notifications
      - type: markdown
        content: |
          ## ⚠️ Recent Conflicts
          
          {{ states('sensor.conflict_status') }}
      
      # Instructions
      - type: markdown
        content: |
          ## 🎯 How to Demo
          
          1. **Start the system**:
             ```bash
             # Terminal 1: Sensors
             python fake_sensors_multiuser.py
             
             # Terminal 2: Controller
             python smart_controller_reg.py
             ```
          
          2. **Create a conflict**:
             - Adjust **Parent** slider to 80%
             - Adjust **Child** slider to 30%
             - Watch AI resolve: Parent wins (higher priority)
          
          3. **Check the terminal**: See conflict resolution logs
          
          4. **Try scenarios**:
             - All users want different brightness
             - Guest tries to override parent
             - Child and parent in same room with different preferences

# Alternative: Compact view for presentations
  - title: Compact Demo
    icon: mdi:view-compact
    cards:
      - type: horizontal-stack
        cards:
          - type: gauge
            entity: sensor.ai_predicted_brightness
            name: "AI Output"
            min: 0
            max: 100
            needle: true
          
          - type: entities
            title: Environment
            entities:
              - sensor.environment_hour
              - sensor.environment_motion
              - sensor.environment_light_level
      
      - type: grid
        columns: 3
        cards:
          - type: entities
            title: 🟢 Parent
            entities:
              - input_number.parent_brightness
          
          - type: entities
            title: 🟡 Child
            entities:
              - input_number.child_brightness
          
          - type: entities
            title: 🔴 Guest
            entities:
              - input_number.guest_brightness
      
      - type: markdown
        content: |
          **Conflict Status**: {{ states('sensor.conflict_status') }}
          
          **Last Update**: {{ as_timestamp(now()) | timestamp_custom('%H:%M:%S') }}
